<style>

}
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }

.wrap { max-width: 560px; margin: 0 auto; padding-top: max(14px, env(safe-area-inset-top, 0px)); padding-bottom: max(28px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

.locs button b { font-size: 14px; } .locs button small { font-size: 10px; color: var(--muted); }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 8px; }

.note { padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.45; }

.muted { color: var(--muted); font-size: 13px; }
label.l, .l { font-size: 14px; font-weight: 600; }
.pin { font-size: 26px; letter-spacing: 12px; text-align: center; }
/* PIN keypad: no text field, so the browser never offers to save a password */
.dots { display: flex; justify-content: center; gap: 18px; padding: 6px 0 2px; }
.dots i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--gold); }
.dots i.on { background: var(--gold); }
.dots.shake { animation: shake .35s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.keypad button { min-height: 62px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); font-family: var(--display); font-size: 26px; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.keypad button:active { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }

.users { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.users button { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; padding: 4px; }
.users button small { font-size: 11px; color: var(--muted); font-weight: 500; }

.countband { padding: 14px 16px; border-radius: 16px; background: var(--red); display: flex; flex-direction: column; gap: 2px; }
.countband small { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
.countband strong { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.1; }

.qty { font-family: var(--display); font-size: 36px; text-align: center; min-height: 70px; border: 2px solid var(--red); background: var(--deep); flex: 1; min-width: 0; }
.qrow { display: flex; gap: 10px; }

.scanbig { min-height: 210px; width: 100%; flex-direction: column; gap: 12px; font-size: 21px; font-weight: 700; border: 3px solid var(--gold); background: rgba(226,178,60,.08); color: var(--gold); border-radius: 20px; }
.scanbig svg { width: 76px; height: 76px; }
.scanbig small { font-size: 13px; font-weight: 400; color: var(--soft); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 560px; margin: 0 auto; max-height: 94vh; overflow-y: auto; background: var(--panel); border-top: 1px solid var(--line); border-radius: 24px 24px 0 0; padding: 10px 16px max(20px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -12px 32px rgba(0,0,0,.4); }

.kpad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

.recount { border: 2px solid var(--gold); background: transparent; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--soft); min-height: 44px; }

.tablebox { overflow-x: auto; border-radius: 14px; border: 1px solid var(--line2); }

td { padding: 10px 12px; border-top: 1px solid var(--line2); vertical-align: middle; }
td.r, th.r { text-align: right; }
td .acts { display: flex; gap: 6px; }
.pos { color: var(--ok); font-weight: 700; } .negv { color: var(--red-soft); font-weight: 700; }
.labels { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.lab { background: #FFFFFF; color: #000; border-radius: 10px; padding: 10px; display: flex; gap: 12px; align-items: center; min-width: 0; }
.lab .qrc { display: flex; flex-direction: column; align-items: center; gap: 3px; flex-shrink: 0; }
.lab svg { width: 80px; height: 80px; flex-shrink: 0; }
.lab .t { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.lab .c { font-size: 11px; font-weight: 700; letter-spacing: 1px; }

.toast.err { background: var(--red-deep); }
.center { text-align: center; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.hgroup { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.scan { position: fixed; inset: 0; z-index: 30; background: #000; display: flex; flex-direction: column; }
.scan video { flex: 1; width: 100%; min-height: 0; object-fit: cover; }

.scan .bar .msg { text-align: center; font-size: 15px; }
.scan .bar .btns { display: flex; gap: 10px; }
.scan .bar .btns .btn { flex: 1; }
@media print { body { background: #fff; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ===== server ===== */
  function api(a, data) {
    var body = Object.assign({ a: a, token: S.token }, data || {});
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw new Error('Server error ' + r.status); return r.json(); })
      .then(function (j) {
        if (!j.ok) {
          if (j.error === 'SIGNED_OUT') { forceLogout(); throw new Error('Your sign-in has expired. Sign in again.'); }
          throw new Error(j.error || 'Something went wrong');
        }
        return j;
      });
  }
  function forceLogout() { stopPoll(); S.token = null; S.user = null; S.countId = null; lsSet('stk-session', null); go('login'); loadUsers(); }

  /* ===== items ===== */
  function setItems(items) {
    LIST = items.map(function (o) { o.h = (o.d + ' ' + o.n + ' ' + o.n.replace('/', '') + ' ' + o.c).toLowerCase(); return o; }).sort(function (a, b) { return a.d.localeCompare(b.d); });
    BYCODE = {}; BYNO = {};
    LIST.forEach(function (o) { BYCODE[o.c] = o; BYNO[o.n.toUpperCase()] = o; });
  }
  function loadItems() {
    return api('items').then(function (j) {
      setItems(j.items); if (j.snap) S.snap = j.snap;
      lsSet('stk-items', { who: S.user.name, role: S.user.role, items: j.items, snap: S.snap });
    });
  }
  function search(q, max) {
    var toks = q.toLowerCase().split(/\s+/).filter(Boolean), out = [], total = 0, up = q.trim().toUpperCase(), exact = BYCODE[up] || null;
    for (var i = 0; i < LIST.length; i++) {
      var it = LIST[i], ok = true;
      for (var t = 0; t < toks.length; t++) if (it.h.indexOf(toks[t]) < 0) { ok = false; break; }
      if (!ok || it === exact) continue;
      total++; if (out.length < max) out.push(it);
    }
    if (exact) { out.unshift(exact); total++; }
    return { items: out, total: total };
  }
  function parseCode(v) {
    v = String(v || '').trim();
    var m = v.match(/#i-([A-Za-z0-9]{4})/); if (m) v = m[1];
    m = v.match(/MRS-STOCK:([A-Za-z0-9]{4})/i); if (m) v = m[1];
    v = v.toUpperCase();
    if (BYCODE[v]) return v;
    if (BYNO[v]) return BYNO[v].c;
    var ws = v.length > 1 && v.indexOf('/') < 0 ? v.charAt(0) + '/' + v.slice(1) : v;
    return BYNO[ws] ? BYNO[ws].c : null;
  }

  /* ===== polling ===== */
  function stopPoll() { if (poll) clearInterval(poll); poll = null; }
  function startPoll(fn, ms) { stopPoll(); fn(); poll = setInterval(function () { if (!document.hidden) fn(); }, ms); }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.view === 'count') refreshCount(); });
  function refreshCounts() {
    return api('counts').then(function (j) {
      S.counts = j.counts; S.countsLoaded = true;
      if (!isMgr() && (S.view === 'wait' || S.view === 'pick')) routeCounter();
      else if (S.view === 'counts') render();
    }).catch(function (e) { toast(e.message, true); });
  }
  function refreshCount() {
    if (!S.countId) return;
    return api('countState', { countId: S.countId }).then(function (j) {
      S.count = j.count;
      if (isMgr()) {
        S.lines = j.lines;
        S.mine = j.lines.filter(function (l) { return l.by === S.user.name; });
        var maxR = {}; j.lines.forEach(function (l) { if (!maxR[l.code] || l.round > maxR[l.code]) maxR[l.code] = l.round; });
        S.recountRounds = j.count.recount || {};
        S.recount = Object.keys(S.recountRounds).filter(function (c) { return S.recountRounds[c] > (maxR[c] || 0); });
      } else { S.mine = j.mine; S.recount = j.recount; S.recountRounds = j.recountRounds || {}; }
      S.pending = S.pending.filter(function (p) { return p.status !== 'saved'; });
      if (S.view === 'count') renderCountLive(); else if (S.view === 'review') render();
    }).catch(function (e) { if (S.view === 'count' || S.view === 'review') toast(e.message, true); });
  }

  /* ===== routing ===== */
  function go(view) { S.view = view; render(); window.scrollTo(0, 0); }
  function afterLogin() {
    S.view = 'loading'; render();
    loadItems().then(function () {
      if (isMgr()) { S.view = S.pendingCode ? 'item' : 'stock'; if (S.pendingCode) { S.item = S.pendingCode; S.pendingCode = null; } render(); }
      else { S.view = 'wait'; render(); startPoll(refreshCounts, 20000); }
    }).catch(function (e) { toast(e.message, true); if (S.token) { S.view = 'login'; render(); } });
  }
  function routeCounter() {
    var open = S.counts.filter(function (c) { return c.status === 'open'; });
    if (S.countId && open.some(function (c) { return c.id === S.countId; })) { enterCount(S.countId); return; }
    if (open.length === 1) enterCount(open[0].id);
    else if (open.length > 1) { if (S.view !== 'pick') go('pick'); else render(); }
    else { if (S.view !== 'wait') go('wait'); else render(); }
  }
  function enterCount(id) {
    S.countId = id; S.count = S.counts.filter(function (c) { return c.id === id; })[0] || null;
    S.cur = null; S.findOpen = false; S.mine = []; S.recount = []; S.pending = [];
    saveSession(); go('count'); startPoll(refreshCount, 15000); requestWake(); takePending();
  }
  function saveSession() { lsSet('stk-session', S.token ? { token: S.token, user: S.user, countId: S.countId } : null); }
  function takePending() {
    var c = S.pendingCode; if (!c || !BYCODE[c]) return; S.pendingCode = null;
    if (S.view === 'count') selectItem(c, false);
    else if (isMgr()) { S.item = c; go('item'); }
  }
  function readHash() {
    var m = (location.hash || '').match(/^#i-([A-Za-z0-9]{4})$/);
    if (m) { S.pendingCode = m[1].toUpperCase(); if (S.user && LIST.length) takePending(); }
  }
  window.addEventListener('hashchange', readHash);
  function requestWake() { try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { wakeLock = w; }).catch(function () { }); } catch (e) { } }
  function releaseWake() { try { if (wakeLock) wakeLock.release(); } catch (e) { } wakeLock = null; }

  /* ===== Sage data upload (added 23 Nov 2026) ===== */
  function viewSage() {

      '<div class="band gold">Now in the app: ' + snapLine() + '</div>' +

    if (done) {

    }

      var locRows = LOCS.map(function (l) { var p = s.perLoc[l] || { lines: 0, qty: 0 }; return '<div class="tile"><span>' + LOCNAME[l] + '</span><b>' + fmt(p.lines) + '</b><small class="muted">items in stock</small></div>'; }).join('');
      h += '<div class="card"><b style="font-size:17px">' + (done ? 'What changed' : 'What this file will change') + '</b>' +
        '<div class="muted">' + esc(s.file) + ' · Sage figures as at <b>' + esc(s.snap) + '</b> (now: ' + esc(s.current || '—') + ')</div>' +
        (s.ageDays >= 1 ? '<div class="note warn">This export is ' + s.ageDays + ' day' + (s.ageDays > 1 ? 's' : '') + ' old. For a count, export fresh from Sage first.</div>' : '') +
        '<div class="g3" style="grid-template-columns:repeat(2,1fr)">' + locRows + '</div>' +
        '<div class="g3"><div class="tile o"><span>App items matched</span><b>' + fmt(s.items - s.notInSageCount) + ' / ' + fmt(s.items) + '</b></div>' +

        '<div class="tile o"><span>Unit changes</span><b>' + fmt(s.unitCount) + '</b></div></div>' +
        '<div class="g3"><div class="tile o"><span>Negative in Sage</span><b>' + fmt(s.neg) + '</b></div>' +
        '<div class="tile o"><span>Lines with consignment</span><b>' + fmt(s.cons) + '</b></div>' +
        '<div class="tile o"><span>Lines in file</span><b>' + fmt(s.lines) + '</b></div></div>' +
        (s.unitCount ? '<details><summary>Unit changes (' + s.unitCount + ')</summary><p class="muted">' + s.unit.map(function (u) { return esc(u[0] + ': ' + u[1] + ' → ' + u[2]); }).join('<br>') + '</p></details>' : '') +
        (s.newInSageCount ? '<details><summary>Stocked in Sage but no app code yet (' + s.newInSageCount + '): need a code and a label</summary><p class="muted">' + s.newInSage.map(esc).join(', ') + (s.newInSageCount > s.newInSage.length ? ' …' : '') + '</p></details>' : '') +
        (s.notInSageCount ? '<details><summary>In the app but not in this Sage file (' + s.notInSageCount + '): left as they are</summary><p class="muted">' + s.notInSage.map(esc).join(', ') + (s.notInSageCount > s.notInSage.length ? ' …' : '') + '</p></details>' : '');
      if (open.length) {

          open.map(function (c) { return esc(c.label) + ' · ' + (LOCNAME[c.loc] || c.loc) + ' · opened by ' + esc(c.openedBy) + ' ' + when(c.openedAt); }).join('<br>') + '</div>' +

          '<p class="muted" style="margin:0">A backup of the current figures is kept in the Sheet, so this can be rolled back.</p>';

  }
  function sagePick(file) {
    if (!file) return;
    if (file.size > 20 * 1024 * 1024) { toast('That file is too big to be the Sage export', true); return; }
    var xl = /\.xlsx?$/i.test(file.name), rd = new FileReader();
    rd.onload = function () {
      var txt;
      if (xl) {
        if (!window.XLSX) { toast('Excel reader did not load. Check the internet connection, or use the CSV export.', true); return; }
        try { txt = sageXlsToCsv_(window.XLSX, new Uint8Array(rd.result)); } catch (e) { toast('Could not read this Excel file: ' + e.message, true); return; }
      } else txt = String(rd.result || '');
      S.sageFile = { name: file.name, size: file.size, time: file.lastModified || Date.now() }; S.sageText = txt; S.sageRes = null; S.sageArm = false; S.sageDone = null; render();
    };
    rd.onerror = function () { toast('Could not read the file', true); };
    if (xl) rd.readAsArrayBuffer(file); else rd.readAsText(file, 'utf-8');
  }
  /* Sage Excel export (.xls/.xlsx) -> CSV text in the same column order as the CSV export. Same code goes in the page. */
  function sageXlsToCsv_(XLSX, buf) {
    var wb = XLSX.read(buf, { type: 'array' });
    var ws = wb.Sheets[wb.SheetNames[0]];
    var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    function d(v) {
      if (typeof v !== 'number') return String(v);
      if (v < 400) return ''; // Sage writes 'no receipt' as day 0/1 (1900)
      var t = new Date(Math.round((v - 25569) * 86400000));
      return t.getUTCFullYear() + '/' + ('0' + (t.getUTCMonth() + 1)).slice(-2) + '/' + ('0' + t.getUTCDate()).slice(-2);
    }
    function q(v) { v = String(v == null ? '' : v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    return rows.map(function (r, i) {
      return r.map(function (v, j) { return q(i > 0 && j === 10 ? d(v) : v); }).join(',');
    }).join('\n');
  }
  function sageCall(apply) {
    S.busy = true; render();
    return api('sageUpload', { csv: S.sageText, fileName: S.sageFile.name, fileTime: S.sageFile.time, apply: !!apply })
      .then(function (j) {
        if (apply) { S.sageDone = { snap: j.snap, backup: j.backup }; S.sageRes = { summary: j.summary, openCounts: [] }; S.snap = j.snap; toast('Sage figures updated'); return loadItems(); }
        S.sageRes = { summary: j.summary, openCounts: j.openCounts || [] }; S.sageDone = null;
      })
      .catch(function (e) { toast(e.message, true); S.sageRes = S.sageRes; })
      .then(function () { S.busy = false; S.sageArm = false; if (S.view === 'sage') render(); });
  }

    else if (v === 'labels') h = viewLabels();
    else if (v === 'sage') h = viewSage();

  function viewCounts() {

    ['Adjustment_Headers', ['ADJENSEQ', 'TRANSNUM', 'DOCNUM', 'HDRDESC', 'TRANSDATE', 'FISCYEAR', 'FISCPERIOD', 'REFERENCE', 'STATUS', 'ENTEREDBY', 'DATEBUS']],
    ['Adjustment_Details', ['ADJENSEQ', 'LINENO', 'ITEMNO', 'LOCATION', 'TRANSTYPE', 'QUANTITY', 'UNIT', 'CONVERSION', 'EXTCOST', 'COMMENTS', 'WOFFACCT', 'STOCKITEM', 'AVGCOST', 'COSTUNIT']],
    ['Adjustment_Header_Opt__Fields', ['ADJENSEQ', 'OPTFIELD', 'VALUE', 'TYPE', 'LENGTH', 'DECIMALS', 'ALLOWNULL', 'VALIDATE', 'SWSET', 'VALINDEX', 'VALIFTEXT', 'VALIFMONEY', 'VALIFNUM', 'VALIFLONG', 'VALIFBOOL', 'VALIFDATE', 'VALIFTIME', 'FDESC', 'VDESC']],
    ['Adjustment_Detail_Opt__Fields', ['ADJENSEQ', 'LINENO', 'OPTFIELD', 'VALUE', 'TYPE', 'LENGTH', 'DECIMALS', 'ALLOWNULL', 'VALIDATE', 'SWSET', 'VALINDEX', 'VALIFTEXT', 'VALIFMONEY', 'VALIFNUM', 'VALIFLONG', 'VALIFBOOL', 'VALIFDATE', 'VALIFTIME', 'FDESC', 'VDESC']],
    ['Adjustment_Detail_Serial_Number', ['ADJENSEQ', 'LINENO', 'SERIALNUMF', 'COST', 'SCOUNT'], 'Adjustment_Detail_Serial_Numbers'],
    ['Adjustment_Detail_Lot_Numbers', ['ADJENSEQ', 'LINENO', 'LOTNUMF', 'EXPIRYDATE', 'QTY', 'QTYSQ', 'COST']]
  ];
  function r2(v) { return Math.round(v * 100) / 100; }
  function sagePlan(c, R) {
    var li = LOCS.indexOf(c.loc), why = [];
    if (c.status !== 'closed') why.push('Close the count first, so nothing can change after the export.');
    var open = R.rows.filter(function (r) { return !r.flag && (r.st === 'recount' || r.st === 'diff' || r.st === 'recounted'); });
    if (open.length) why.push(open.length + ' counted line(s) still need Accept or a recount (' + open.slice(0, 6).map(function (r) { return r.it.n; }).join(', ') + (open.length > 6 ? ', …' : '') + ').');
    if (!WOFF[c.loc]) why.push('No write-off account for ' + c.loc + '.');
    var go = R.rows.filter(function (r) { return !r.flag && r.st === 'accepted' && r.diff !== 0; }), fix = R.rows.filter(function (r) { return r.flag; });
    var nocost = go.filter(function (r) { return !(stCost(r.it, li) > 0); });
    if (nocost.length) why.push(nocost.length + ' item(s) have no cost in Sage at ' + c.loc + ' (' + nocost.slice(0, 6).map(function (r) { return r.it.n; }).join(', ') + '). Ask Maryke for the cost first.');
    var lj = String(c.openedAt), d = new Date(lj); if (isNaN(d)) d = new Date();
    var y = d.getFullYear(), m = d.getMonth() + 1, dd = d.getDate();
    var fy = m >= 7 ? y + 1 : y, fp = m >= 7 ? m - 6 : m + 6;
    var p2 = function (x) { return ('0' + x).slice(-2); };
    var doc = ('STK-' + c.loc + '-' + String(c.id).replace(/^C/, '').slice(0, 13).replace(/(\d{8})-(\d{4})\d*/, '$1-$2')).slice(0, 22);
    var lines = go.map(function (r, i) {
      var cost = stCost(r.it, li), qty = Math.abs(r.diff);
      return { lineNo: (i + 1) * 100, item: r.it.n, desc: r.it.d, type: r.diff > 0 ? 5 : 6, qty: qty, unit: r.it.u, cost: Math.round(cost * 1e6) / 1e6, ext: r2(qty * cost), src: stCostSrc(r.it, li), diff: r.diff };
    });
    var up = lines.filter(function (l) { return l.type === 5; }), down = lines.filter(function (l) { return l.type === 6; });
    var vUp = up.reduce(function (a, l) { return a + l.ext; }, 0), vDown = down.reduce(function (a, l) { return a + l.ext; }, 0);
    if (!go.length && !why.length) why.push('There are no accepted differences. Sage already matches this count, so there is nothing to import.');
    return {
      ok: !why.length, why: why, lines: lines, up: up.length, down: down.length, vUp: r2(vUp), vDown: r2(vDown), net: r2(vUp - vDown),
      fallback: lines.filter(function (l) { return l.src !== 'avg'; }), unc: R.unc.length, fix: fix,
      doc: doc, y: y, m: m, d: dd, dmy: p2(dd) + '/' + p2(m) + '/' + y, fy: String(fy), fp: fp, woff: WOFF[c.loc],
      desc: ('Stocktake ' + c.loc + ' ' + c.label + ' ' + p2(dd) + '/' + p2(m) + '/' + y).slice(0, 60),
      ref: ('Stock Vs IP ' + c.id).slice(0, 60)
    };
  }
  function sageSheets(c, P) {
    var serial = Math.round((Date.UTC(P.y, P.m - 1, P.d) - Date.UTC(1899, 11, 30)) / 86400000);
    var dt = { t: 'n', v: serial, z: 'yyyy/mm/dd' };
    var data = {};
    data.Adjustment_Headers = [[0, 0, P.doc, P.desc, dt, P.fy, P.fp, P.ref, 1, 'ADMIN', dt]];
    data.Adjustment_Details = P.lines.map(function (l) { return [0, l.lineNo, l.item, c.loc, l.type, l.qty, l.unit, 1, l.ext, null, P.woff, true, l.cost, l.unit]; });
    return SAGE_SHEETS.map(function (sh) { return { name: sh[0], head: sh[1], table: sh[2] || sh[0], rows: data[sh[0]] || [] }; });
  }
  var xlsxLoading = null;
  function loadXlsx() {
    if (window.XLSX) return Promise.resolve();
    if (xlsxLoading) return xlsxLoading;
    xlsxLoading = new Promise(function (res, rej) { var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = function () { xlsxLoading = null; rej(new Error('Could not load the Excel writer. Check the connection and try again.')); }; document.head.appendChild(s); });
    return xlsxLoading;
  }
  function sageWorkbook(c, P) {
    var wb = XLSX.utils.book_new(), names = [];
    sageSheets(c, P).forEach(function (sh) {
      var ws = XLSX.utils.aoa_to_sheet([sh.head]);
      sh.rows.forEach(function (row, ri) {
        row.forEach(function (v, ci) {
          if (v == null) return;
          var ref = XLSX.utils.encode_cell({ r: ri + 1, c: ci });
          ws[ref] = typeof v === 'object' ? { t: v.t, v: v.v, z: v.z } : typeof v === 'number' ? { t: 'n', v: v } : typeof v === 'boolean' ? { t: 'b', v: v } : { t: 's', v: String(v) };
        });
      });
      ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: sh.rows.length, c: sh.head.length - 1 } });
      XLSX.utils.book_append_sheet(wb, ws, sh.name);
      // Sage finds each table by a workbook-level name over header + rows (as in Jo-Anne's template)
      names.push({ Name: sh.table, Ref: sh.name + '!$A$1:$' + XLSX.utils.encode_col(sh.head.length - 1) + '$' + (sh.rows.length + 1) });
    });
    wb.Workbook = { Names: names };
    return wb;
  }
  function sageDownload() {
    var c = S.count, R = computeReview(); if (!c || !R) return;
    var P = sagePlan(c, R); if (!P.ok) { S.sagePanel = true; render(); return; }
    loadXlsx().then(function () {
      XLSX.writeFile(sageWorkbook(c, P), 'SAGE IMPORT - IC Adjustment - ' + P.doc + '.xlsx', { bookType: 'xlsx', bookSST: true });
      toast('Sage file downloaded: ' + P.doc);
    }).catch(function (e) { toast(e.message, true); });
  }
  function sagePanel(c, R) {
    var P = sagePlan(c, R);
    var close = '<button class="btn sm ghost" data-act="sage-close" style="margin-left:auto">Close</button>';
    if (!P.ok) return '<div class="card" style="margin-top:12px"><div class="hgroup"><b style="font-size:17px">Export for Sage: not ready yet</b>' + close + '</div>' +
      P.why.map(function (w) { return '<div class="note warn">' + esc(w) + '</div>'; }).join('') + '</div>';
    var rows = [['Document number', P.doc], ['Adjustment date', P.dmy], ['Sage year / period', P.fy + ' - ' + ('0' + P.fp).slice(-2)], ['Write-off account', P.woff],
      ['Increase lines (type 5)', fmt(P.up) + ' · ' + rand(P.vUp)], ['Decrease lines (type 6)', fmt(P.down) + ' · ' + rand(-P.vDown)], ['Net effect on stock value', rand(P.net)]]
      .map(function (r) { return '<div class="tile o"><span>' + r[0] + '</span><b style="font-size:17px">' + esc(r[1]) + '</b></div>'; }).join('');
    var notes = (P.fix.length ? '<div class="note warn"><b>' + P.fix.length + ' line(s) left out of this file</b> because they are negative or hold consignment stock in Sage: ' + esc(P.fix.slice(0, 12).map(function (r) { return r.it.n + ' (count ' + r.fin + ', Sage ' + r.sage + (r.cons ? ' + ' + r.cons + ' cons.' : '') + ')'; }).join(', ')) + (P.fix.length > 12 ? ', …' : '') + '. Fix these in Sage by hand. The CSV export lists them all.</div>' : '') +
      '<div class="note plain">' + fmt(P.unc) + ' item(s) with Sage stock were not counted. They are <b>not</b> in the file, so Sage keeps their quantities.</div>' +
      (P.fallback.length ? '<div class="note warn">' + P.fallback.length + ' line(s) have no Sage average cost at ' + c.loc + ' and use the most recent cost instead: ' + esc(P.fallback.slice(0, 8).map(function (l) { return l.item; }).join(', ')) + (P.fallback.length > 8 ? ', …' : '') + '. Maryke can check these after the import.</div>' : '');
    return '<div class="card" style="margin-top:12px"><div class="hgroup"><b style="font-size:17px">Export for Sage: ready</b>' + close + '</div>' +
      '<div class="tiles">' + rows + '</div>' + notes +
      '<div class="note plain">In Sage: Inventory Control › I/C Transactions › Adjustments › File › Import › Excel. Open ' + esc(P.doc) + ', check the lines, then post. Sage refuses the same document twice, so a file can only be imported once.</div>' +
      '<div class="hgroup" style="justify-content:flex-end"><button class="btn red" data-act="sage-download">Download Sage file</button></div></div>';
  }

  function csvCell(v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function exportCsv() {
    var c = S.count, R = computeReview(); if (!c || !R) return;
    var out = [['Code', 'Sage item', 'Description', 'Unit', 'Location', 'Sage qty', 'Consignment qty', 'Sage + consignment', 'Count', 'Recount', 'Final', 'Difference', 'Unit cost', 'Value', 'Status', 'Counted by', 'Sage action', 'Size check']];
    R.rows.concat(R.unc).forEach(function (r) { out.push([r.code, r.it.n, r.it.d, r.it.u, c.loc, r.sage, r.cons || 0, r.book, r.first == null ? '' : r.first, r.maxR > 1 ? r.fin : '', r.st === 'none' ? '' : r.fin, r.diff, r.cost.toFixed(2), r.val.toFixed(2), STLABEL[r.st], r.who, r.flag === 'neg' ? 'Fix in Sage by hand: negative in Sage' : r.flag === 'cons' ? 'Fix in Sage by hand: consignment' : (r.st === 'accepted' && r.diff ? 'In Sage file' : ''), r.swap ? 'Possible size swap with ' + r.swap.map(function (o) { return o.it.n + ' (' + o.diff + ')'; }).join('; ') + (r.swapBal ? ' - balances' : '') : '']); });
    var blob = new Blob(['﻿' + out.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n')], { type: 'text/csv' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Stocktake ' + c.loc + ' ' + c.label.replace(/[^\w -]/g, '') + ' ' + String(c.openedAt).slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  /* ===== phone back button =====
     Back steps back inside the app first (scanner, item, review, find panel...).
     On a main screen the first back only warns; a second back within 2 seconds leaves the app. */
  var lastBack = 0;
  function backInApp() {
    if (!$('scan').hidden) { closeScanner(); if (S.view === 'count') focusEntry(); return true; }
    var v = S.view;
    if (v === 'item') { act('tab', { v: 'stock' }); return true; }
    if (v === 'review') { act('tab', { v: 'counts' }); return true; }
    if (v === 'pin') { act('pin-cancel', {}); return true; }
    if (v === 'count' && S.findOpen) { S.findOpen = false; S.findQ = ''; render(); return true; }
    if (v === 'count' && S.cur) { act('wrong', {}); return true; }
    if ((v === 'counts' || v === 'labels' || v === 'sage') && isMgr()) { act('tab', { v: 'stock' }); return true; }
    return false;
  }
  function guardBack() { try { history.pushState({ stk: 'guard' }, ''); } catch (e) { } }
  try { history.replaceState({ stk: 'base' }, ''); } catch (e) { }
  guardBack();
  window.addEventListener('popstate', function (ev) {
    if (ev.state && ev.state.stk === 'guard') return;          // forward navigation, nothing to do
    if (backInApp()) { lastBack = 0; guardBack(); return; }
    var now = Date.now();
    if (now - lastBack < 2000) { history.back(); return; }      // second back: leave the app
    lastBack = now; guardBack(); toast('Press back again to exit');
  });

  /* ===== start ===== */
  function loadUsers() { return api('users').then(function (j) { S.users = j.users; if (S.view === 'login' || S.view === 'pin') render(); }).catch(function (e) { S.pinErr = 'Cannot reach the stock service: ' + e.message; if (S.view === 'login') render(); }); }
  function start() {
    if (!/^https:\/\/script\.google\.com\//.test(API_URL)) { go('setup'); return; }
    var l = lsGet('stk-loc'); if (LOCS.indexOf(l) >= 0) S.loc = l;
    var ls = lsGet('stk-labels'); if (Array.isArray(ls)) S.labelSet = ls;
    var au = lsGet('stk-autoscan'); if (au === false) S.autoScan = false;
    readHash();
    loadUsers();
    var sess = lsGet('stk-session');
    if (sess && sess.token && sess.user) {
      S.token = sess.token; S.user = sess.user; S.countId = sess.countId || null;
      var cached = lsGet('stk-items');
      if (cached && cached.who === S.user.name && cached.role === S.user.role) { setItems(cached.items); S.snap = cached.snap || ''; }
      var next = function () {
        if (S.countId) { S.view = 'count'; render(); startPoll(refreshCount, 15000); requestWake(); takePending(); }
        else if (isMgr()) { S.view = S.pendingCode ? 'item' : 'stock'; if (S.pendingCode) { S.item = S.pendingCode; S.pendingCode = null; } render(); }
        else { S.view = 'wait'; render(); startPoll(refreshCounts, 20000); }
      };
      if (LIST.length) { next(); loadItems().catch(function () { }); } else { S.view = 'loading'; render(); loadItems().then(next).catch(function (e) { toast(e.message, true); }); }
    } else go('login');
  }
  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); }); }
  start();
})();
</script>
