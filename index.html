<style>
:root {

}
html, body { margin: 0; min-height: 100%; }

.tag.recount { background: var(--warn-bg); color: var(--warn); } .tag.recounted { background: var(--info-bg); color: var(--info); }

.muted { color: var(--muted); font-size: 13px; }
label.l, .l { font-size: 14px; font-weight: 600; }
.pin { font-size: 26px; letter-spacing: 12px; text-align: center; }
.users { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.users button { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; padding: 4px; }
.users button small { font-size: 11px; color: var(--muted); font-weight: 500; }
.users button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.users button[aria-pressed="true"] small { color: var(--gold-ink); }
.countband { padding: 14px 16px; border-radius: 16px; background: var(--red); display: flex; flex-direction: column; gap: 2px; }
.countband small { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
.countband strong { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.1; }
.countband span { font-size: 14px; }
.countband.closed { background: var(--line); }
.entry { font-family: var(--display); font-size: 30px; letter-spacing: 8px; text-align: center; text-transform: uppercase; min-height: 64px; border: 2px solid var(--line); background: var(--deep); }
.qty { font-family: var(--display); font-size: 36px; text-align: center; min-height: 70px; border: 2px solid var(--red); background: var(--deep); flex: 1; min-width: 0; }
.qrow { display: flex; gap: 10px; }
.line { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border-radius: 10px; border: 1px solid var(--line2); }
.line .d { flex: 1; min-width: 0; font-size: 13px; color: var(--soft); line-height: 1.3; overflow-wrap: anywhere; }
.line .n { font-size: 20px; min-width: 40px; }
.line.pending { border-style: dashed; } .line.failed { border-color: var(--red); }
.iconbtn { width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; color: var(--red-soft); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.recount { border: 2px solid var(--gold); background: transparent; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--soft); min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--gold); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters button { min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line); background: transparent; font-weight: 600; font-size: 13px; }
.filters button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.tablebox { overflow-x: auto; border-radius: 14px; border: 1px solid var(--line2); }
table { width: 100%; min-width: 980px; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 600; color: var(--soft); background: var(--deep); padding: 10px 12px; white-space: nowrap; }
td { padding: 10px 12px; border-top: 1px solid var(--line2); vertical-align: middle; }
td.r, th.r { text-align: right; }
td .acts { display: flex; gap: 6px; }
.pos { color: var(--ok); font-weight: 700; } .negv { color: var(--red-soft); font-weight: 700; }
.labels { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.lab { background: #FFFFFF; color: #0B1B33; border-radius: 10px; padding: 10px; display: flex; gap: 10px; align-items: center; min-width: 0; }
.lab svg { width: 96px; height: 96px; flex-shrink: 0; }
.lab .t { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lab small { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: #4A5B76; }
.lab .c { font-family: var(--display); font-size: 22px; letter-spacing: 3px; }
.lab .dd { font-size: 12px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.lab .no { font-size: 11px; color: #4A5B76; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: max-content; max-width: calc(100% - 32px); background: var(--ok-bg); color: #FFFFFF; padding: 12px 16px; border-radius: 12px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.35); z-index: 40; }
.toast.err { background: var(--red-deep); }
.center { text-align: center; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.hgroup { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
/* scanner */
.scan { position: fixed; inset: 0; z-index: 30; background: #000; display: flex; flex-direction: column; }
.scan video { flex: 1; width: 100%; min-height: 0; object-fit: cover; }
.scan .frame { position: absolute; left: 50%; top: 42%; width: min(70vw, 300px); aspect-ratio: 1; transform: translate(-50%, -50%); border: 3px solid var(--gold); border-radius: 18px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); pointer-events: none; }
.scan .bar { padding: 14px max(16px, env(safe-area-inset-left, 0px)) max(18px, env(safe-area-inset-bottom, 0px)); background: var(--bg); display: flex; flex-direction: column; gap: 10px; }
.scan .bar .msg { text-align: center; font-size: 15px; }
.scan .bar .btns { display: flex; gap: 10px; }
.scan .bar .btns .btn { flex: 1; }
@media print { body { background: #fff; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<body>
<div id="app"><div class="wrap"><p class="muted">Loading…</p></div></div>
<div id="scan" class="scan" hidden>
  <video id="scanvid" playsinline muted></video>
  <div class="frame" aria-hidden="true"></div>
  <div class="bar">
    <div id="scanmsg" class="msg" role="status">Point the camera at the shelf label QR</div>
    <div class="btns"><button class="btn" id="scantorch" type="button" hidden>Light on</button><button class="btn gold" id="scanclose" type="button">Close</button></div>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function () {
  'use strict';
  /* ===== settings ===== */
  var API_URL = 'https://script.google.com/macros/s/AKfycbyq-OPO1MqWiz8BcSEb8rzG4v14szO-gP5syX8hS8-6FkidSRSWqD5GGlGjQzSxBha3/exec';
  var LOCS = ['CAR', 'EVA', 'WEL', 'STE'];
  var LOCNAME = { CAR: 'Carletonville', EVA: 'Evander', WEL: 'Welkom', STE: 'Steelpoort' };
  var APP_URL = location.origin + location.pathname;

  /* ===== state ===== */
  var S = {
    view: 'loading', token: null, user: null, app: 'Stock Vs IP', snap: '', users: [], loc: 'CAR', q: '', item: null,
    counts: [], countsLoaded: false, countId: null, count: null, lines: [], mine: [], recount: [], recountRounds: {},
    pending: [], newLoc: 'CAR', newLabel: '', filter: 'diff', cur: null, curFromScan: false, findOpen: false, findQ: '',
    pinPick: null, pinErr: '', labelSet: [], labelQ: '', pendingCode: null, busy: false, autoScan: true
  };
  var LIST = [], BYCODE = {}, BYNO = {}, poll = null, wakeLock = null;
  var app = document.getElementById('app');

  /* ===== helpers ===== */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) { if (n == null) return '—'; var neg = n < 0; var s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); return (neg ? '−' : '') + s; }
  function sfmt(n) { return n > 0 ? '+' + fmt(n) : fmt(n); }
  function rand(v) { var neg = v < 0; var a = Math.abs(v).toFixed(2).split('.'); return (neg ? '−R' : 'R') + a[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ',' + a[1]; }
  function dmy(iso) { if (!iso) return '—'; var p = String(iso).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
  function when(iso) { if (!iso) return ''; var d = new Date(iso); if (isNaN(d)) return iso; return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
  function isMgr() { return S.user && S.user.role === 'manager'; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  var toastT;
  function toast(msg, err) { var t = $('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 3200); }
  var ICON = {
    search: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9B8D0" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
    lock: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
    back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
    trash: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
    plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
    scan: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>'
  };
  function logo(big) { return '<span class="logo' + (big ? ' big' : '') + '"><b>STOCK</b><i>Vs</i><b>IP</b></span>'; }

  /* ===== server ===== */
  function api(a, data) {
    var body = Object.assign({ a: a, token: S.token }, data || {});
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw new Error('Server error ' + r.status); return r.json(); })
      .then(function (j) {
        if (!j.ok) {
          if (j.error === 'SIGNED_OUT') { forceLogout(); throw new Error('Your sign-in has expired. Sign in again.'); }
          throw new Error(j.error || 'Something went wrong');
        }
        return j;
      });
  }
  function forceLogout() { stopPoll(); S.token = null; S.user = null; S.countId = null; lsSet('stk-session', null); go('login'); loadUsers(); }

  /* ===== items ===== */
  function setItems(items) {
    LIST = items.map(function (o) { o.h = (o.d + ' ' + o.n + ' ' + o.n.replace('/', '') + ' ' + o.c).toLowerCase(); return o; }).sort(function (a, b) { return a.d.localeCompare(b.d); });
    BYCODE = {}; BYNO = {};
    LIST.forEach(function (o) { BYCODE[o.c] = o; BYNO[o.n.toUpperCase()] = o; });
  }
  function loadItems() {
    return api('items').then(function (j) {
      setItems(j.items); if (j.snap) S.snap = j.snap;
      lsSet('stk-items', { who: S.user.name, role: S.user.role, items: j.items, snap: S.snap });
    });
  }
  function search(q, max) {
    var toks = q.toLowerCase().split(/\s+/).filter(Boolean), out = [], total = 0, up = q.trim().toUpperCase(), exact = BYCODE[up] || null;
    for (var i = 0; i < LIST.length; i++) {
      var it = LIST[i], ok = true;
      for (var t = 0; t < toks.length; t++) if (it.h.indexOf(toks[t]) < 0) { ok = false; break; }
      if (!ok || it === exact) continue;
      total++; if (out.length < max) out.push(it);
    }
    if (exact) { out.unshift(exact); total++; }
    return { items: out, total: total };
  }
  function parseCode(v) {
    v = String(v || '').trim();
    var m = v.match(/#i-([A-Za-z0-9]{4})/); if (m) v = m[1];
    m = v.match(/MRS-STOCK:([A-Za-z0-9]{4})/i); if (m) v = m[1];
    v = v.toUpperCase();
    if (BYCODE[v]) return v;
    if (BYNO[v]) return BYNO[v].c;
    var ws = v.length > 1 && v.indexOf('/') < 0 ? v.charAt(0) + '/' + v.slice(1) : v;
    return BYNO[ws] ? BYNO[ws].c : null;
  }

  /* ===== polling ===== */
  function stopPoll() { if (poll) clearInterval(poll); poll = null; }
  function startPoll(fn, ms) { stopPoll(); fn(); poll = setInterval(function () { if (!document.hidden) fn(); }, ms); }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.view === 'count') refreshCount(); });
  function refreshCounts() {
    return api('counts').then(function (j) {

  var STLABEL = { match: 'Match', diff: 'Difference', recount: 'Recount requested', recounted: 'Recounted', accepted: 'Accepted', none: 'Not counted' };
  function computeReview() {
    var c = S.count; if (!c) return null;
    var li = LOCS.indexOf(c.loc), g = {}, rc = c.recount || {}, acc = c.accepted || {}, rows = [];
    S.lines.forEach(function (l) { (g[l.code] = g[l.code] || []).push(l); });

      var it = BYCODE[code]; if (!it) return;

  function labelPdf() {

    var blob = new Blob(['﻿' + out.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n')], { type: 'text/csv' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Stocktake ' + c.loc + ' ' + c.label.replace(/[^\w -]/g, '') + ' ' + String(c.openedAt).slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  /* ===== start ===== */
  function loadUsers() { return api('users').then(function (j) { S.users = j.users; if (S.view === 'login' || S.view === 'pin') render(); }).catch(function (e) { S.pinErr = 'Cannot reach the stock service: ' + e.message; if (S.view === 'login') render(); }); }
  function start() {
    if (!/^https:\/\/script\.google\.com\//.test(API_URL)) { go('setup'); return; }
    var l = lsGet('stk-loc'); if (LOCS.indexOf(l) >= 0) S.loc = l;
    var ls = lsGet('stk-labels'); if (Array.isArray(ls)) S.labelSet = ls;
    var au = lsGet('stk-autoscan'); if (au === false) S.autoScan = false;
    readHash();
    loadUsers();
    var sess = lsGet('stk-session');
    if (sess && sess.token && sess.user) {
      S.token = sess.token; S.user = sess.user; S.countId = sess.countId || null;
      var cached = lsGet('stk-items');
      if (cached && cached.who === S.user.name && cached.role === S.user.role) { setItems(cached.items); S.snap = cached.snap || ''; }
      var next = function () {
        if (S.countId) { S.view = 'count'; render(); startPoll(refreshCount, 15000); requestWake(); takePending(); }
        else if (isMgr()) { S.view = S.pendingCode ? 'item' : 'stock'; if (S.pendingCode) { S.item = S.pendingCode; S.pendingCode = null; } render(); }
        else { S.view = 'wait'; render(); startPoll(refreshCounts, 20000); }
      };
      if (LIST.length) { next(); loadItems().catch(function () { }); } else { S.view = 'loading'; render(); loadItems().then(next).catch(function (e) { toast(e.message, true); }); }
    } else go('login');
  }
  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); }); }
  start();
})();
